<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tap Rush · GameCompany2</title>

  <!-- Sci-fi UI 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-0: #04040a;
      --bg-1: #0a0a14;
      --neon-cyan: #00e5ff;
      --neon-magenta: #ff2bd6;
      --neon-gold: #ffd24a;
      --text: #e8ecf5;
      --dim: #6b708f;
    }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: var(--bg-0);
      color: var(--text);
      overflow: hidden;
      font-family: "Rajdhani", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    /* 전체 배경에 은은한 비네트 + 스캔라인 */
    body::before {
      content: "";
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 50% 40%, rgba(0,229,255,0.06), transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(255,43,214,0.05), transparent 55%),
        repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 2px,
          rgba(255,255,255,0.015) 3px,
          rgba(255,255,255,0.015) 3px
        );
      pointer-events: none;
      z-index: 0;
    }

    #game-root {
      position: relative; z-index: 1;
      width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    canvas { touch-action: none; display: block; }

    /* 좌상단 런처 복귀 배지 */
    .back-link {
      position: fixed; top: 14px; left: 14px; z-index: 10;
      color: var(--dim); text-decoration: none;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
      background: rgba(10,10,20,0.7);
      padding: 8px 12px; border-radius: 2px;
      border: 1px solid rgba(0,229,255,0.25);
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .back-link:hover {
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 16px rgba(0,229,255,0.35);
    }

    /* 우하단 신호등 (디자인 액센트) */
    .sigil {
      position: fixed; bottom: 14px; right: 14px; z-index: 10;
      display: flex; gap: 6px; align-items: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px; letter-spacing: 2px;
      color: var(--dim);
    }
    .sigil .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--neon-cyan);
      box-shadow: 0 0 10px var(--neon-cyan);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <a class="back-link" href="../../index.html">◂ LAUNCHER</a>
  <div class="sigil"><span class="dot"></span> GC2 · TAP RUSH · v1</div>
  <div id="game-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
